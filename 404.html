<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена — Экстатик Денс</title>

  <link rel="icon" href="images/favicon/favicon.ico" sizes="any">

  <!-- Те же шрифты, что на основном сайте -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Jost:wght@200;300;400&display=swap"
    rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --font-head: 'Jost', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 17px;
      line-height: 1.65;
      color: #F2EDE4;
      background:
        linear-gradient(
          135deg,
          #556B2F 0%,
          #2C3E50 50%,
          #1A1A2E 100%
        );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 560px;
      text-align: center;
      position: relative;    /* ← добавить */
      z-index: 2;            /* ← добавить */
    }

    .code {
      font-family: var(--font-head);
      font-weight: 200;
      font-size: clamp(96px, 22vw, 180px);
      line-height: 1;
      letter-spacing: .06em;
      opacity: .35;
      margin-bottom: 24px;
    }

    .title {
      font-family: var(--font-head);
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: clamp(16px, 2vw, 22px);
      margin-bottom: 24px;
    }

    .text {
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.7;
      opacity: .85;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 17px 46px;
      border: 1px solid currentColor;
      color: inherit;
      text-decoration: none;
      font-family: var(--font-head);
      font-weight: 300;
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      transition: background .5s ease, transform .5s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, .08);
      transform: translateY(-2px);
    }

    .btn:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
    }

      /* Canvas-волна внизу страницы */
  .osc {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 120px;
    z-index: 1;
    pointer-events: none;
    opacity: .85;
  }

  /* Контент — поверх canvas */
  .wrap {
    position: relative;
    z-index: 2;
  }

  

  </style>
</head>
<body>

  <main class="wrap">
    <div class="code" aria-hidden="true">404</div>

    <h1 class="title">Страница не найдена</h1>

    <p class="text">
      Возможно, ссылка устарела, страница переехала<br>
      или в адресе есть опечатка.
    </p>

    <a href="/Site-Ecstatic-Dance-NN/" class="btn">
      На главную
    </a>
  </main>

  <canvas
    class="osc"
    data-type="sine"
    data-color="#C9E4A8"
    aria-hidden="true"
  ></canvas>

  <script>
    'use strict';

    (function () {

      const canvas = document.querySelector('canvas.osc');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const type = canvas.dataset.type || 'sine';
      const color = canvas.dataset.color || '#FFFFFF';
      const phase = Math.random() * 100;

      const reducedMotion =
        window.matchMedia('(prefers-reduced-motion: reduce)');

      let w = 0;
      let h = 0;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        w = rect.width;
        h = rect.height;
        if (w <= 0 || h <= 0) return;

        canvas.width = Math.max(1, Math.floor(w * dpr));
        canvas.height = Math.max(1, Math.floor(h * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function waveValue(u, t) {
        return Math.sin(u * Math.PI * 4 + t * 0.75);
      }

      function drawFrame(elapsed) {
        if (!w || !h) return;

        const midY = h / 2;
        const amplitude = h * 0.36;

        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = color;
        ctx.globalAlpha = .85;
        ctx.lineWidth = 1.2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();

        const step = 3;
        for (let x = 0; x <= w; x += step) {
          const u = w > 0 ? x / w : 0;
          const taper = Math.sin(Math.PI * u);
          const value = waveValue(u, elapsed + phase);
          const y = midY - value * amplitude * taper;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      const FRAME_INTERVAL = 1000 / 30;
      let lastDraw = 0;
      let paused = document.hidden;
      const startTime = performance.now();

      function loop(now) {
        if (paused) return;
        if (now - lastDraw < FRAME_INTERVAL) {
          requestAnimationFrame(loop);
          return;
        }
        lastDraw = now;
        const elapsed = (now - startTime) / 1000;
        drawFrame(elapsed);
        requestAnimationFrame(loop);
      }

      document.addEventListener('visibilitychange', () => {
        paused = document.hidden;
        if (!paused) {
          lastDraw = 0;
          if (!reducedMotion.matches) requestAnimationFrame(loop);
          else drawFrame(0);
        }
      });

      window.addEventListener('resize', () => {
        resize();
        if (reducedMotion.matches) drawFrame(0);
      }, { passive: true });

      resize();

      if (reducedMotion.matches) {
        drawFrame(0);
      } else {
        requestAnimationFrame(loop);
      }

    })();

  </script>

</body>
</html>
