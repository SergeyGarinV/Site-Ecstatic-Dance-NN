name: Обновление даты события

on:
  # Каждый час (в 0 минут). Время — UTC.
  # '0 * * * *'      — каждый час
  # '0 */3 * * *'    — каждые 3 часа
  # '0 6 * * *'      — ежедневно в 06:00 UTC (= 09:00 МСК)
  schedule:
    - cron: '0 */3 * * *'

  # Позволяет запустить вручную кнопкой в UI GitHub
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Получить и распарсить событие
        run: node .github/scripts/fetch-event.js

      - name: Закоммитить и запушить, если изменилось
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event.json

          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "chore: обновление даты события [skip ci]"
            git push
          fi