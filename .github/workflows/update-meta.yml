name: Update meta tags from event.json

on:
  push:
    branches: [main]
    paths:
      - 'event.json'
  workflow_dispatch:   # позволяет запустить вручную из интерфейса GitHub

permissions:
  contents: write      # нужно, чтобы Actions мог коммитить обратно

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run build-meta.py
        run: python3 build-meta.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Нет изменений — пропускаем коммит"
          else
            git commit -m "chore: update meta tags from event.json [skip ci]"
            git push
          fi